<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
 <title id="title">C4 nível 2: contêineres do Foot Fanatics</title>
<desc id="desc">Aplicação web, API, banco de dados, pipeline batch, armazenamento analítico e registro de modelos, com fluxos online e diário separados.</desc>
 <defs>
<filter id="s">
<feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#5b0f2d" flood-opacity=".15"/>
</filter>
<marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
<path d="M0 0L8 4 0 8z" fill="#8b3659"/>
</marker>
</defs>
 <rect width="1200" height="520" rx="24" fill="#fff8f5"/>
<g font-family="Outfit,Arial,sans-serif">
<text x="34" y="38" font-size="18" font-weight="700" fill="#5b0f2d">CONTAINER · onde rodam as responsabilidades online e batch?</text>
 <rect x="174" y="62" width="990" height="400" rx="24" fill="none" stroke="#DD2476" stroke-width="3"/>
<text x="195" y="91" font-size="15" font-weight="800" fill="#DD2476">Foot Fanatics · fronteira do sistema</text>
