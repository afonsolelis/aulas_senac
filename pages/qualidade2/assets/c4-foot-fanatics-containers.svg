<text x="86" y="246" text-anchor="middle" font-size="12" fill="#5b0f2d">navegador</text>
 <rect x="205" y="125" width="190" height="120" rx="17" fill="#FF512F"/>
<text x="300" y="159" text-anchor="middle" font-size="17" font-weight="800" fill="white">Aplicação Web</text>
<text x="300" y="182" text-anchor="middle" font-size="12" fill="white">experiência das personas</text>
<text x="300" y="216" text-anchor="middle" font-size="12" fill="white">[proposta tecnológica]</text>
 <rect x="465" y="125" width="215" height="120" rx="17" fill="#DD2476"/>
<text x="572" y="158" text-anchor="middle" font-size="17" font-weight="800" fill="white">API da aplicação</text>
<text x="572" y="182" text-anchor="middle" font-size="12" fill="white">E1 · E2 · E3 · E4</text>
<text x="572" y="214" text-anchor="middle" font-size="12" fill="white">Java 21 + Spring Boot</text>
