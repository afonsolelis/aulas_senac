<text x="835" y="222" text-anchor="middle" font-size="12" fill="white">assinaturas, conteúdo</text>
<rect x="965" y="137" width="165" height="96" rx="17" fill="white" stroke="#FF512F" stroke-width="2" stroke-dasharray="8 5"/>
