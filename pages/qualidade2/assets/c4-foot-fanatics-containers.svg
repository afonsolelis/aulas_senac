<text x="380" y="370" text-anchor="middle" font-size="12" fill="white">cron · seleção incremental · gates</text>
<text x="380" y="400" text-anchor="middle" font-size="12" fill="white">PROPOSTA DIDÁTICA</text>
 <path d="M585 320h190v86c0 24-190 24-190 0z" fill="#FF512F"/>
