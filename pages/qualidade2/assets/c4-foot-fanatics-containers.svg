<text x="680" y="384" text-anchor="middle" font-size="12" fill="white">novos + checkpoint</text>
 <rect x="855" y="312" width="230" height="112" rx="17" fill="white" stroke="#DD2476" stroke-width="2" stroke-dasharray="8 5"/>
<text x="970" y="347" text-anchor="middle" font-size="16" font-weight="800" fill="#5b0f2d">Registro de modelos</text>
