<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="https://res.cloudinary.com/dyhjjms8y/image/upload/v1759512534/logo-SENAC_k3d68v.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quadro de Avisos - Hub de Aulas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>

<body data-avisos-inline>
  <nav class="navbar navbar-expand-lg navbar-light bg-light sticky-top shadow-sm">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="../index.html">
        <img src="https://res.cloudinary.com/dyhjjms8y/image/upload/v1759512534/logo-SENAC_k3d68v.png" alt="Senac Logo"
          class="me-2">
        <span class="fw-bold text-dark">Hub de Aulas</span>
      </a>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="#">Avisos</a></li>
          <li class="nav-item"><a class="nav-link" href="professor.html">Professor</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <header class="hero-section text-center d-flex align-items-center justify-content-center"
    style="background: linear-gradient(135deg, #0f2027, #2c5364);">
    <div class="container">
      <div class="mb-3">
        <i class="fas fa-bullhorn fa-4x text-white-50" aria-hidden="true"></i>
      </div>
      <h1 class="display-4 fw-bold mb-2">Quadro de Avisos</h1>
      <p class="lead mb-0 opacity-75">Recados do professor Afonso para as turmas</p>
    </div>
  </header>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="d-flex flex-wrap gap-2 align-items-center justify-content-between mb-4">
          <p class="text-muted mb-0 small">
            <i class="fas fa-circle-info me-1" aria-hidden="true"></i>
            O mesmo quadro aparece em qualquer página do Hub, pelo botão flutuante.
          </p>
          <button type="button" class="btn btn-dark btn-sm rounded-pill px-3" id="btn-professor">
            <i class="fas fa-lock me-2" aria-hidden="true"></i> Área do professor
          </button>
        </div>

        <div id="quadro-avisos">
          <p class="text-muted text-center py-5">Carregando avisos…</p>
        </div>
      </div>
    </div>
  </div>

  <footer class="bg-light text-dark py-4 mt-5">
    <div class="container text-center">
      <img src="https://res.cloudinary.com/dyhjjms8y/image/upload/v1759512534/logo-SENAC_k3d68v.png" alt="Senac"
        height="25" class="mb-2 opacity-75">
      <p class="small text-muted mb-0">&copy; 2026 Senac, Hub de Aulas do Professor Afonso.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/avisos.js" defer></script>
  <script>
    // O quadro e a área do professor são os mesmos do botão flutuante:
    // esta página só empresta o container e o botão de entrada.
    window.addEventListener('load', function () {
      if (!window.HubAvisos) return;
      window.HubAvisos.montarEm(document.getElementById('quadro-avisos'));
      document.getElementById('btn-professor').addEventListener('click', function () {
        window.HubAvisos.abrirProfessor();
      });
    });
  </script>
</body>

</html>
